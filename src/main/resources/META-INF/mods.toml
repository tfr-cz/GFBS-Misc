modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gfbs_gltf"
mandatory = true
versionRange = "[1.5.0,2.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gfbs_main"
mandatory = false
versionRange = "[1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gfbs_auralis"
mandatory = false
# 可选：装了就把门循环音交给 Auralis 做空间音频，没装则回退原版 SoundManager（反射探测，不硬依赖）。
versionRange = "[2.0.0,)"
ordering = "AFTER"
side = "CLIENT"
